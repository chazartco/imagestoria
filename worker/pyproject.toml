[project]
name = "afterimage-worker"
version = "0.1.0"
description = "Reads the pictures of an ImageStoria library on a machine of your own."
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pillow>=10.3",
]

[project.optional-dependencies]
# Search by meaning and people run their models with ONNX Runtime on the GPU.
# The NVIDIA libraries come with it from pip, so no separate CUDA install is needed.
gpu = [
  "numpy>=1.26",
  "onnxruntime-gpu[cuda,cudnn]>=1.21",
  "huggingface-hub>=0.24",
]
cpu = [
  "numpy>=1.26",
  "onnxruntime>=1.21",
  "huggingface-hub>=0.24",
]
# The InsightFace model pack, for your own non-commercial use only. See the README before choosing it.
insightface = ["insightface>=0.7.3", "opencv-python-headless>=4.9"]

[project.scripts]
afterimage-worker = "afterimage_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["afterimage_worker"]
