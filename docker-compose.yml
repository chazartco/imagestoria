# ImageStoria with its own Postgres. Copy .env.example to .env first, then: docker compose up -d --build
# Put a reverse proxy with HTTPS in front of it for anything beyond your own machine.

services:
  app:
    build: .
    image: afterimage:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://afterimage:${POSTGRES_PASSWORD:-afterimage}@db:5432/afterimage
      DATA_DIR: /data
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Reachable from this machine only unless APP_BIND says otherwise (0.0.0.0 opens it to the network).
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - media:/data
      # To bring in an existing folder of photos, mount it read-only and run the import command (see README):
      # - /path/to/your/photos:/import:ro

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: afterimage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afterimage}
      POSTGRES_DB: afterimage
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afterimage -d afterimage"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  media:
  db:
